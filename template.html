<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weekly Digest · {{WEEK}}</title>
<style>
  /* One region = one page: a full-screen sheet on screen, one A4 sheet in print.
     All sizes are in rem, so changing html's font-size in @media print scales the whole page. */
  :root { --paper:#f4ecd8; --ink:#2b2b2b; --rule:#8a8068; --muted:#6b6454; --bar:3.2rem; }
  * { box-sizing: border-box; }
  html { font-size: 16px; scroll-snap-type: y proximity; }
  body { margin:0; background:var(--paper); color:var(--ink); line-height:1.3;
         font-family: Georgia, "Times New Roman", "DejaVu Serif", serif; }

  /* Masthead stays visible while you scroll, so every page shows which week it is. */
  header { position: sticky; top:0; z-index:1; height:var(--bar); background:var(--paper);
           display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
           padding: .5rem 1.5rem 0; border-bottom: 4px double var(--ink); }
  h1 { margin:0; font-size:1.6rem; letter-spacing:.04em; font-variant:small-caps; line-height:1.1; }
  .sub { color:var(--muted); font-style:italic; font-size:.9rem; }

  .region { min-height: calc(100vh - var(--bar)); padding: 1.2rem 1.5rem 2rem; scroll-snap-align: start;
            scroll-margin-top: var(--bar); border-bottom: 1px solid var(--rule); }
  .region:last-child { border-bottom: 0; }
  h2 { margin:0 0 .8rem; font-size:2rem; text-transform:uppercase; letter-spacing:.2em; text-align:center;
       border-top:2px solid var(--ink); border-bottom:1px solid var(--ink); padding:.2rem 0; }

  .cats { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; }
  .cat { padding: 0 1.2rem; }
  .cat + .cat { border-left: 1px solid var(--rule); }
  h3 { margin:0 0 .6rem; font-size:.85rem; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); }
  article { margin-bottom: 1rem; }
  h4 { margin:0; font-size:1.1rem; line-height:1.2; }
  h4 a { color:inherit; text-decoration:none; }
  h4 a:hover { text-decoration:underline; }
  .day { color:var(--muted); font-weight:normal; font-size:.75rem; white-space:nowrap; }
  article p { margin:.2rem 0 0; font-size:1rem; }

  @media (max-width: 700px) {
    header { height:auto; flex-direction:column; align-items:center; gap:0; padding-bottom:.3rem; position:static; }
    .region { min-height:0; }
    .cat { padding: 0; }
    .cat + .cat { border-left:0; margin-top:.8rem; }
  }

  @media print {
    @page { size: A4; margin: 10mm; }
    html { font-size: 10pt; scroll-snap-type: none; }
    body { background:#fff; }
    header { position:static; height:auto; background:none; padding:0 0 .3rem; margin-bottom:.5rem; }
    .region { min-height:0; padding:0; border:0; break-before: page; }
    .region:first-child { break-before: auto; }
    .cats { grid-template-columns: repeat(3, 1fr); }
    article p { font-size:.95rem; }
  }
</style>
</head>
<body>
  <header>
    <h1>The Weekly Digest</h1>
    <div class="sub">{{WEEK}} · {{RANGE}}</div>
  </header>
  <main>{{BODY}}</main>
</body>
</html>
